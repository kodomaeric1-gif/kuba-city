const compressVideo=(file,prog)=>new Promise((res,rej)=>{

    mr.onstop=()=>{URL.revokeObjectURL(v.src);const b=new Blob(chunks,{type:"video/webm"});if(b.size>900000)rej(new Error("Vidéo trop lourde, choisis une vidéo plus courte"));else toUrl(b)};
    v.onended=done;setTimeout(done,MAX+400);
    mr.start(500);v.play().catch(()=>{v.muted=true;return v.play()}).then(draw).catch(()=>rej(new Error("Lecture de la vidéo impossible")));

});

    ${curComm&&html`<${Chat} key=${curComm.id} ent=${{...curComm,type:"comm",sub:curComm.desc||"Communauté"}} path=${["comms",curComm.id,"posts"]} uid=${uid} users=${users} canPost=${curComm.owner===uid} hid=${prefs.hiddenMsgs} clearedAt=${prefs.cleared[curComm.id]} onHideMsg=${id=>savePrefs({hiddenMsgs:{[id]:true}})} onBlockUser=${id=>savePrefs({blocked:[...new Set([...prefs.blocked,id])]})} onMenu=${()=>setSheet("commmenu")} onErr=${onErr} call=${call} onBack=${()=>setOpen(null)} onSend=${m=>sendPost(curComm,m)}/>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
